<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crop Disease Classifier</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
  <style>
    body { margin: 40px; }
    .center { max-width:600px; margin: auto; text-align:center; }
    .small { font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
  <div class="center">
    <h2>🌱 Crop Disease Classifier</h2>
    <p class="small">Upload a leaf photo and press Predict. Results are saved to the results gallery.</p>
    <form action="/predict" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required>
      <button type="submit" class="button">Predict Disease</button>
    </form>
    <br>
    <a href="/gallery" class="button">View Prediction Gallery</a>
  </div>
</body>
</html>
