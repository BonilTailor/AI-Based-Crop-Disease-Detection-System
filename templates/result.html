<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prediction Result</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
  <style>
    body { margin: 30px; }
    .container { max-width:900px; margin:auto; text-align:center; }
    .images { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; }
    img { border:1px solid #ccc; max-width:420px; }
    .meta { margin:10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Prediction Result</h2>
    <div class="meta">
      <h3>Prediction: {{ prediction }}</h3>
      <h4>Confidence: {{ confidence }}%</h4>
    </div>

    <div class="images">
      <div>
        <h4>Original</h4>
        <img src="{{ orig_url }}" alt="original">
        <p><a href="{{ orig_url }}" download class="button">⬇ Download Original</a></p>
      </div>
      <div>
        <h4>Grad-CAM Overlay</h4>
        <img src="{{ heat_url }}" alt="heatmap">
        <p><a href="{{ heat_url }}" download class="button">⬇ Download Heatmap</a></p>
      </div>
    </div>

    <p><a href="/" class="button">Upload Another</a> <a href="/gallery" class="button">Open Gallery</a></p>
  </div>
</body>
</html>
